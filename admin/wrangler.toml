name = "freshsouk-private-admin"
main = "src/worker.mjs"
compatibility_date = "2026-10-28"
workers_dev = false
preview_urls = false

[build]
command = "node scripts/build-assets.mjs"

[assets]
directory = ".assets"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "freshsouk-private-admin"
database_id = "00000000-0000-0000-0000-000000000000" # Replace with your private D1 ID after approval.
migrations_dir = "db"

[[ratelimits]]
name = "ORDER_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[vars]
ACCESS_TEAM_DOMAIN = "REPLACE_WITH_TEAM.cloudflareaccess.com"
ACCESS_AUD = "REPLACE_WITH_ACCESS_APPLICATION_AUD"
ALLOWED_ORIGIN = "https://sifiabdessamad09-collab.github.io"
PUBLIC_ORDER_INTAKE_ENABLED = "false"
TURNSTILE_HOSTNAME = "sifiabdessamad09-collab.github.io"

# Configure ADMIN_EMAILS and TURNSTILE_SECRET with `wrangler secret put`, never here.
# Add an approved custom-domain route only after review. No deploy workflow is provided.
[observability]
enabled = false
