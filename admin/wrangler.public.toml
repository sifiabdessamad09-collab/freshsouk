name = "freshsouk-shop-api"
main = "src/public-worker.mjs"
compatibility_date = "2026-10-28"
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "REPLACE_WITH_SHARED_ADMIN_DATABASE"
database_id = "00000000-0000-0000-0000-000000000000"

[[ratelimits]]
name = "ORDER_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[vars]
ALLOWED_ORIGIN = "https://sifiabdessamad09-collab.github.io"
TURNSTILE_HOSTNAME = "sifiabdessamad09-collab.github.io"
PUBLIC_ORDER_INTAKE_ENABLED = "false"

# TURNSTILE_SECRET is a server secret, never a frontend asset.
# This entry point has no ASSETS, ADMIN_EMAILS or Access bindings.
[observability]
enabled = false
