name: FreshSOUK private admin checks
on:
  push:
    branches: [codex/freshsouk-admin, codex/freshsouk-boutique-sync]
    paths: [admin/**, docs/admin/**, .github/workflows/admin-ci.yml, .gitignore, index.html, redesign.js, sw.js, storefront.js]
  pull_request:
    branches: [main]
    paths: [admin/**, docs/admin/**, .github/workflows/admin-ci.yml, .gitignore, index.html, redesign.js, sw.js, storefront.js]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - name: Build only the approved UI assets
        run: npm run build
      - name: Preserve published source and verify asset boundary
        run: |
          npm run check
          node scripts/check-assets.mjs
      - name: Authentication, private orders and transactional stock tests
        run: npm test
      - name: Compile Worker without deploying or creating remote resources
        run: npx wrangler deploy --dry-run --outdir .dry-run
      - name: Compile public entry point without deploying
        run: npx wrangler deploy --config wrangler.public.toml --dry-run --outdir .dry-run-public
